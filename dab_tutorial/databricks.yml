bundle:
  name: dab_tutorial
  uuid: 02b16ca3-ae82-467b-841a-b8d299261568

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
      # root_path: /Workspace/Dev/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/arrijit.sam@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Prod/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: arrijit.sam@gmail.com
        level: CAN_MANAGE
